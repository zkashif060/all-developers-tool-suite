  <!-- Offline Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      });
    }
  </script>

  <!-- Immediate Theme Initializer to prevent flash of wrong theme -->
  <script>
    (function() {
      try {
        const storedTheme = localStorage.getItem('devtools_theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (storedTheme === 'dark' || (!storedTheme && systemPrefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        // Fallback gracefully if localStorage is unavailable
      }
    })();
  </script>
